schema_version: "1.0"
id: "gesture-dataset-preparation"
name: "Gesture Dataset Preparation"
version: "0.2.0"
description: "Choose and prepare the labelled motion dataset (synthetic, public, or the developer's own capture), check it, and decide whether it can support the gestures wanted before any training."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
selection:
  aliases: ["gesture dataset", "dataset preparation", "check gesture data"]
  triggers: ["Get me a gesture dataset", "Is my gesture data good enough to train on", "Prepare data for GesturDJ"]
synapse:
  layer: "domain"
  domain: "gesturdj"
  owner: "Srinivas Reddy Gudala"
  backup_owner: "TBD: community maintainers (see finding F20 in ../../GESTURDJ_SYNAPSE_SKILLS.md)"
  review_cadence: "Each ONNX Runtime or PyTorch major release, or Ventuno Q image release"
  visibility: "public"
  maturity: "proposed"
  supported_versions: ["Arduino Ventuno Q (Ubuntu): not yet tested", "Windows PC, Python 3.10, numpy 2.2, scikit-learn 1.7, torch 2.14, onnx 1.23, onnxruntime 1.23 (tested 2026-11-05)"]
  feedback_channel: >
    TBD: Developer Portal community channel. Until it exists, GitHub Issues on the
    qa-intermediate-curriculum repository (label: synapse-gesturdj).
  deprecation_path: >
    Set maturity: "deprecated" and announce via feedback_channel with 30-day notice;
    point to the replacement skill.
  developer_journey_stage: ["enablement"]
  dependencies: ["gesture-event-contract", "p3-self-service-boundaries", "device-and-host-discovery"]
  authoritative_docs: ["../../GESTURDJ_SYNAPSE_SKILLS.md", "../../gesture_scripts/README.md", "../../gesture_scripts/check_dataset.py", "../../gesture_scripts/make_synthetic_dataset.py"]
  a2a:
    role: "skill"
    accepts_from: ["gesturdj-agent", "gesturdj-build-journey"]
contract:
  prerequisites: ["A device profile (device-and-host-discovery) showing numpy is importable", "The list of gesture labels the developer wants"]
  inputs: ["Source choice: synthetic | public download | own capture", "Gesture labels", "Output folder (absolute path)"]
  outputs: ["Dataset folder DATASET_ROOT/<label>/*.csv", "dataset-report.json from check-dataset", "A decision: usable | needs more data | not usable, with reasons"]
  negative_scope:
    - "Does not train or evaluate a model"
    - "Does not record sensor data (imu-capture is a separate, approved step)"
    - "Does not overwrite an existing non-empty dataset folder"
    - "Does not treat synthetic-data accuracy as evidence the model works on real motion"
  validation:
    - "check-dataset exits 0: at least 2 labels, each with at least 5 samples, no NaN/inf"
    - "Warnings (fewer than 20 samples per label, imbalance above 3x, flat series) are shown to the developer, not hidden"
  failure_behavior: "Report the exact check that failed and the file; do not delete or edit the developer's data; ask whether to collect more."
  known_failure_modes:
    - "make_synthetic_dataset.py resolves a relative --data_dir against the script's own folder, not the current folder: pass an absolute path"
    - "make_synthetic_dataset.py refuses to write into a non-empty folder (by design)"
    - "download_dataset_uwave.py failed 2026-11-05: UCR URL 404 (moved), timeseriesclassification.com 403; cause on this network undetermined (corporate proxy vs site), so the public-dataset path is UNVERIFIED (evidence/pc-run/09_download_uwave.log)"
    - "Synthetic data is trivially separable (held-out accuracy 1.0): it proves the pipeline runs, not that the model is good"
  two_config_evidence:
    - "PC (Windows ARM64 host, x64 Python 3.10 under emulation, clean venv), 2026-11-05: synthetic dataset 3 labels x 50 samples, lengths 60-160, check-dataset ok=true (evidence/pc-run/dataset-report.json)"
    - "Second configuration: not run (public dataset download unverified; no real IMU capture yet)"
authority:
  source_docs: "See synapse.authoritative_docs"
  approved_tools: ["gesture_scripts/make_synthetic_dataset.py", "gesture_scripts/check_dataset.py", "gesture_scripts/download_dataset_uwave.py (unverified)"]
  endpoints: ["https://www.timeseriesclassification.com/ (public dataset host, unverified)"]
  provenance: "projects/gesture_recognition (gesture_scripts/); PC run evidence under evidence/pc-run/"
control:
  approval_gates: "See safety.requires_explicit_approval"
  consequential_actions: ["Writes a new dataset folder (only if empty or absent)"]
  recovery_and_rollback: "Delete the dataset folder this skill created."
review_gates:
  # pilot = gates 1 + 3 met; supported = all six met
  ownership: "met: named owner; backup owner open (F20)"
  scope_and_boundary: "met: see negative_scope"
  validation_evidence: "partial: 1 of 2 configurations run (PC, synthetic data); public download and real capture not validated"
  feedback_mechanism: "open: community channel not yet defined"
  discoverability: "open: not yet on the Developer Portal"
  lifecycle_commitment: "open: community maintenance model undefined (F20)"
project:
  root_relative_to_skill: "../.."
safety:
  default_mode: "non-destructive"
  requires_explicit_approval:
    - "Downloading a public dataset (show source and license first)"
    - "Writing into a folder that already has files"
  secrets_policy: "Never persist credentials, tokens, private keys, or passwords. Read them from environment variables; redact before logging."
