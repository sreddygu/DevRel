schema_version: "1.0"
id: "gesture-to-live-mix-design"
name: "Gesture to Live Mix Design"
version: "0.1.0"
description: "Design how a recognized gesture changes the music live (clip, tempo, volume, filter, layers) with debounce and a latency budget; and, for the optional background path, how a sustained gesture becomes a text style prompt and valid lyrics for the music model."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
selection:
  aliases: ["gesture mapping", "live mix design", "music intent"]
  triggers: ["Map my gestures to music actions", "Make GesturDJ feel live", "Write a style prompt and lyrics from a gesture"]
synapse:
  layer: "domain"
  domain: "gesturdj"
  owner: "Srinivas Reddy Gudala"
  backup_owner: "TBD: community maintainers (see finding F20 in ../../GESTURDJ_SYNAPSE_SKILLS.md)"
  review_cadence: "Each ONNX Runtime major release or Ventuno Q image release"
  visibility: "public"
  maturity: "proposed"
  supported_versions: ["Arduino Ventuno Q (Ubuntu)", "ONNX Runtime CPU", "Windows or Linux host with Python 3.10+"]
  feedback_channel: >
    TBD: Developer Portal community channel. Until it exists, GitHub Issues on the
    qa-intermediate-curriculum repository (label: synapse-gesturdj).
  deprecation_path: >
    Set maturity: "deprecated" and announce via feedback_channel with 30-day notice;
    point to the replacement skill.
  developer_journey_stage: ["platform-experience"]
  dependencies: ["gesture-event-contract", "p3-self-service-boundaries", "device-and-host-discovery"]
  authoritative_docs: ["../../gesture_scripts/README.md", "../../GESTURDJ_SYNAPSE_SKILLS.md"]
  a2a:
    role: "skill"
    accepts_from: ["gesturdj-agent"]
contract:
  prerequisites: ["A device profile (device-and-host-discovery)", "A list of gesture labels the recognizer outputs", "A clip library manifest, or an explicit statement that none exists yet"]
  inputs: ["Gesture labels", "Clip library manifest (names, tempo, length, loopable)", "Latency budget in milliseconds (default 200)", "Optional style text, for example acoustic folk, guitar, warm, gentle"]
  outputs: ["mix_map.json: gesture to mix action, with debounce_ms, cooldown_ms and min_confidence per gesture", "Latency budget table: sensor, inference, mix, audio buffer", "Optional: style prompt and LRC lyrics file for background generation"]
  negative_scope:
    - "Does not run the recognizer, the mixer or the music model"
    - "Does not claim the design works: only that it is consistent; live validation is a separate step"
    - "Does not pick music for the developer's taste"
  validation:
    - "Every gesture label maps to exactly one action, or is explicitly unmapped"
    - "Sum of the latency budget stages is at most the stated budget"
    - "Any LRC has one [mm:ss.xx] line per timestamp in ascending order and no empty lines"
  failure_behavior: "Stop and report the conflict (two gestures to one action, budget exceeded, malformed LRC); do not silently pick a winner."
  known_failure_modes:
    - "Accidental triggers: raise min_confidence or cooldown; confirm with real gestures"
    - "Audio buffer dominates the budget: reduce buffer size or accept a larger budget; measure, do not guess"
    - "Generation takes minutes: it must stay on the background path, never on the live path"
    - "An empty line in LRC breaks text processing"
  two_config_evidence:
    - "Qualcomm IQ8 board, 2026-11-10: mix_map.json for 3 gestures run through gesture_scripts/live_mixer.py with 6 replayed sensor windows: 4 applied, 1 debounced, 1 cooldown; worst estimated gesture-to-sound 45.7 ms against 200 ms (evidence/iq8-run/live-mixer-report.json). The estimate stops at player start plus the configured audio buffer; not measured at the speaker, no real gesture"
    - "LRC rules come from DiffRhythm notebook runs on IQ8; Ventuno Q: not run"
authority:
  source_docs: "See synapse.authoritative_docs"
  approved_tools: ["any text editor for mix_map.json"]
  endpoints: []
  provenance: "academy/GesturDJ; IQ8 replay run under evidence/iq8-run/"
control:
  approval_gates: "See safety.requires_explicit_approval"
  consequential_actions: []
  recovery_and_rollback: "Design only; delete or edit mix_map.json to roll back."
review_gates:
  # pilot = gates 1 + 3 met; supported = all six met
  ownership: "met: named owner; backup owner open (F20)"
  scope_and_boundary: "met: see negative_scope"
  validation_evidence: "open: run on an IQ8 with replayed windows only; no real gesture, not a Ventuno Q"
  feedback_mechanism: "open: community channel not yet defined"
  discoverability: "open: not yet on the Developer Portal"
  lifecycle_commitment: "open: community maintenance model undefined (F20)"
project:
  root_relative_to_skill: "../.."
safety:
  default_mode: "non-destructive"
  secrets_policy: "Never persist credentials, tokens, private keys, or passwords. Read them from environment variables; redact before logging."
