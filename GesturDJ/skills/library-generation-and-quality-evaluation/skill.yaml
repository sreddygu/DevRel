schema_version: "1.0"
id: "library-generation-and-quality-evaluation"
name: "Library Generation and Quality Evaluation"
version: "0.1.0"
description: "Generate a few music clips in the background from style prompts, then check each clip and the set with objective measures (length, loudness, clipping, silence, loop seam) before they join the live mixer's library."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
selection:
  aliases: ["generate clips", "clip library", "check generated music"]
  triggers: ["Make clips for GesturDJ", "Are my generated clips usable", "Build the clip library"]
synapse:
  layer: "domain"
  domain: "gesturdj"
  owner: "Srinivas Reddy Gudala"
  backup_owner: "TBD: community maintainers (see finding F20 in ../../GESTURDJ_SYNAPSE_SKILLS.md)"
  review_cadence: "Each ONNX Runtime major release or Ventuno Q image release"
  visibility: "public"
  maturity: "proposed"
  supported_versions: ["Qualcomm IQ8 (Qualcomm Linux 2.0, HTP v75)", "QAIRT 2.51 on a Windows x64 PC with WSL", "Arduino Ventuno Q: not run"]
  feedback_channel: >
    TBD: Developer Portal community channel. Until it exists, GitHub Issues on the
    qa-intermediate-curriculum repository (label: synapse-gesturdj).
  deprecation_path: >
    Set maturity: "deprecated" and announce via feedback_channel with 30-day notice;
    point to the replacement skill.
  developer_journey_stage: ["platform-experience"]
  dependencies: ["gesture-event-contract", "p3-self-service-boundaries", "device-and-host-discovery", "gesture-to-live-mix-design", "music-model-npu-deployment", "npu-quantization-and-accuracy-gating"]
  authoritative_docs: ["../../ACE-Step/README.md", "../../ACE-Step/IQ8_NPU_WAV_STATUS.md", "../../ACE-Step/IQ8_SSH_RUNBOOK.md"]
  a2a:
    role: "skill"
    accepts_from: ["gesturdj-agent"]
contract:
  prerequisites: ["npu-quantization-and-accuracy-gating passed for the qualified ACE-Step setup", "Instrumental prompt compatible with the static six-token condition"]
  inputs: ["Instrumental prompt", "Sampler steps (27 is the quality baseline)", "Qualified ACE-Step contexts"]
  outputs: ["One 10.031021-second WAV per prompt", "WAV-header and board-health validation", "A qualified or failed generation gate"]
  negative_scope:
    - "Never on the live path: a clip takes minutes"
    - "Does not say a clip sounds good: it checks only the qualified runtime contract"
    - "Does not choose music for the developer's taste"
  validation:
    - "Each WAV is exactly 10.031021 seconds, stereo, 48 kHz, and 16-bit PCM"
    - "Every qualified NPU batch has cosine at least 0.999 and no external-abort events"
  failure_behavior: "Name the failed batch or runtime check; do not weaken the qualification gate."
  known_failure_modes:
    - "Lyrics or variable-length conditions violate the static encoder contract"
    - "A board reset during generation: the pipeline retries after the board returns"
    - "Passing runtime qualification does not mean the music is good"
  two_config_evidence:
    - "Qualcomm IQ8, 2026-11-20: 27-step instrumental ACE-Step run completed in 552.8 seconds with zero external-abort events; all six qualified batches exceeded 0.999 cosine (ACE-Step/IQ8_NPU_WAV_STATUS.md)"
    - "Ventuno Q: not run"
authority:
  source_docs: "See synapse.authoritative_docs"
  approved_tools: ["ACE-Step/data/iq8/runner/run_iq8_controlmaster_wav.sh", "ACE-Step/data/iq8/runner/ace_step_iq8_infer.py"]
  endpoints: ["SSH (TCP/22) to a board the developer owns; address supplied at runtime, never stored"]
  provenance: "academy/GesturDJ; IQ8 runs under evidence/iq8-run/"
control:
  approval_gates: "See safety.requires_explicit_approval"
  consequential_actions: ["Running the graphs on the NPU for several minutes per clip"]
  recovery_and_rollback: "Generated clips are new files; delete them to roll back."
review_gates:
  # pilot = gates 1 + 3 met; supported = all six met
  ownership: "met: named owner; backup owner open (F20)"
  scope_and_boundary: "met: see negative_scope"
  validation_evidence: "open: one IQ8 and one PC pipeline; objective checks only; no listening panel"
  feedback_mechanism: "open: community channel not yet defined"
  discoverability: "open: not yet on the Developer Portal"
  lifecycle_commitment: "open: community maintenance model undefined (F20)"
project:
  root_relative_to_skill: "../.."
safety:
  default_mode: "non-destructive"
  requires_explicit_approval: ["Overwriting an existing clip library", "Rebooting a board"]
  secrets_policy: "Never persist credentials, tokens, private keys, or passwords. Read them from environment variables; redact before logging."
