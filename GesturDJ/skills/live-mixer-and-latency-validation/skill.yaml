schema_version: "1.0"
id: "live-mixer-and-latency-validation"
name: "Live Mixer and Latency Validation"
version: "0.1.0"
description: "Replay gestures through the recognizer, the mix map and the audio player many times and check the estimated gesture-to-sound time against the budget, with the audio stage taken from a measured number."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
selection:
  aliases: ["live latency", "gesture to sound budget", "mixer validation"]
  triggers: ["Is GesturDJ fast enough to feel live", "Check the 200 ms budget", "Validate my mix map on the board"]
synapse:
  layer: "domain"
  domain: "gesturdj"
  owner: "Srinivas Reddy Gudala"
  backup_owner: "TBD: community maintainers (see finding F20 in ../../GESTURDJ_SYNAPSE_SKILLS.md)"
  review_cadence: "Each ONNX Runtime major release or Ventuno Q image release"
  visibility: "public"
  maturity: "proposed"
  supported_versions: ["Qualcomm IQ8 (Qualcomm Linux 2.0)", "Arduino Ventuno Q (Ubuntu)", "ONNX Runtime CPU", "Windows or Linux host with Python 3.10+"]
  feedback_channel: >
    TBD: Developer Portal community channel. Until it exists, GitHub Issues on the
    qa-intermediate-curriculum repository (label: synapse-gesturdj).
  deprecation_path: >
    Set maturity: "deprecated" and announce via feedback_channel with 30-day notice;
    point to the replacement skill.
  developer_journey_stage: ["platform-experience"]
  dependencies: ["gesture-event-contract", "p3-self-service-boundaries", "device-and-host-discovery", "on-device-gesture-validation", "gesture-to-live-mix-design", "audio-output-integration"]
  authoritative_docs: ["../../gesture_scripts/README.md", "../../GESTURDJ_SYNAPSE_SKILLS.md"]
  a2a:
    role: "skill"
    accepts_from: ["gesturdj-agent"]
contract:
  prerequisites: ["An exported ONNX model that passed on-device-gesture-validation", "mix_map.json (gesture-to-live-mix-design)", "Clips and a chosen player and buffer (audio-output-integration)"]
  inputs: ["Model folder", "mix_map.json", "Clips folder", "Recorded sensor windows", "Audio stage in ms (use the measured player overhead for a conservative check)", "Budget in ms (default 200)"]
  outputs: ["live-mixer-report.json: per-event outcome (applied, debounced, cooldown, below confidence)", "live-latency.json: p50, p95 and max per stage and for the total, with a pass or fail"]
  negative_scope:
    - "Does not measure sound at a speaker"
    - "Does not use real gestures: recorded or synthetic windows are replayed"
    - "Does not tune the mix map to pass"
  validation:
    - "p95 of the estimated gesture-to-sound time is at most the budget"
    - "Debounce and cooldown suppress what the mix map says they should"
  failure_behavior: "Report the stage that dominates the total and its number; never raise the budget or lower the buffer figure to pass."
  known_failure_modes:
    - "A large audio buffer fails the budget on its own: at 500 ms the p95 total is about 511 ms"
    - "The configured buffer and the process-level overhead both understate the audio stage: at the driver level a cold start is 236 to 280 ms, which alone is over the 200 ms budget"
    - "A player per gesture fails the budget on the IQ8; use an output stream kept open (live_mixer.py --player warm), which passes"
    - "Replay latency is not the feel of a live gesture; a person has to confirm that (finding F8)"
  two_config_evidence:
    - "Qualcomm IQ8 board, 2026-11-10, 200 replayed gestures, three audio-stage assumptions: 40 ms buffer p95 52.8 ms pass (evidence/iq8-run/live-latency-buffer40.json); 500 ms buffer p95 511 ms fail (evidence/iq8-run/live-latency-buffer500.json); process-level overhead 134 ms p95 145.3 ms pass (evidence/iq8-run/live-latency-measured-overhead.json); driver-level cold start 249 ms p95 260.6 ms FAIL (evidence/iq8-run/live-latency-driver-level.json); warm output stream, audio stage 112 ms (worst warm path to the sink plus the hardware queue), p95 112.6 ms pass (evidence/iq8-run/live-latency-warm.json)"
    - "Replay of 4 events through the mix map with the warm output: 4 applied, recognizer under 2 ms and mix under 0.4 ms (evidence/iq8-run/live-mixer-warm.json)"
    - "Replay of 6 events through the mix map: 4 applied, 1 debounced, 1 cooldown (evidence/iq8-run/live-mixer-report.json)"
    - "Ventuno Q and real gestures: not run"
authority:
  source_docs: "See synapse.authoritative_docs"
  approved_tools: ["gesture_scripts/live_mixer.py", "gesture_scripts/validate_live_latency.py", "gesture_scripts/warm_output.py"]
  endpoints: []
  provenance: "academy/GesturDJ; IQ8 runs under evidence/iq8-run/"
control:
  approval_gates: "See safety.requires_explicit_approval"
  consequential_actions: []
  recovery_and_rollback: "Starts and stops a local audio player process; nothing to roll back."
review_gates:
  # pilot = gates 1 + 3 met; supported = all six met
  ownership: "met: named owner; backup owner open (F20)"
  scope_and_boundary: "met: see negative_scope"
  validation_evidence: "open: replay only on an IQ8; no real gesture, no speaker, not a Ventuno Q"
  feedback_mechanism: "open: community channel not yet defined"
  discoverability: "open: not yet on the Developer Portal"
  lifecycle_commitment: "open: community maintenance model undefined (F20)"
project:
  root_relative_to_skill: "../.."
safety:
  default_mode: "non-destructive"
  requires_explicit_approval: []
  secrets_policy: "Never persist credentials, tokens, private keys, or passwords. Read them from environment variables; redact before logging."
