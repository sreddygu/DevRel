schema_version: "1.0"
id: "model-export-and-deployment"
name: "Model Export and Deployment"
version: "0.2.0"
description: "Export the trained PyTorch gesture model to a single-file ONNX model, prove it matches the original, and package exactly the files a torch-free target needs."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
selection:
  aliases: ["onnx export", "deploy gesture model", "package model for board"]
  triggers: ["Export my gesture model to ONNX", "Get my gesture model onto the Ventuno Q", "Why does my ONNX model not load on the board"]
synapse:
  layer: "domain"
  domain: "gesturdj"
  owner: "Srinivas Reddy Gudala"
  backup_owner: "TBD: community maintainers (see finding F20 in ../../GESTURDJ_SYNAPSE_SKILLS.md)"
  review_cadence: "Each ONNX Runtime or PyTorch major release, or Ventuno Q image release"
  visibility: "public"
  maturity: "proposed"
  supported_versions: ["Arduino Ventuno Q (Ubuntu): not yet tested", "Windows PC, Python 3.10, numpy 2.2, scikit-learn 1.7, torch 2.14, onnx 1.23, onnxruntime 1.23 (tested 2026-11-05)"]
  feedback_channel: >
    TBD: Developer Portal community channel. Until it exists, GitHub Issues on the
    qa-intermediate-curriculum repository (label: synapse-gesturdj).
  deprecation_path: >
    Set maturity: "deprecated" and announce via feedback_channel with 30-day notice;
    point to the replacement skill.
  developer_journey_stage: ["enablement"]
  dependencies: ["gesture-event-contract", "p3-self-service-boundaries", "gesture-model-training-and-evaluation", "device-and-host-discovery"]
  authoritative_docs: ["../../GESTURDJ_SYNAPSE_SKILLS.md", "../../gesture_scripts/README.md", "../../gesture_scripts/ventunoq.md", "../../gesture_scripts/export_gesture_pytorch_to_onnx.py", "../../gesture_scripts/gesture_preprocess.py"]
  a2a:
    role: "skill"
    accepts_from: ["gesturdj-agent", "gesturdj-build-journey"]
contract:
  prerequisites: ["PyTorch checkpoint, config and labels from gesture-model-training-and-evaluation", "torch, onnx and onnxscript importable on the host (requirements-train-pytorch.txt)"]
  inputs: ["Output folder with gesture_model.pt, gesture_config.json, gesture_labels.json", "Target: PC | Ventuno Q (copying is a separate approved step)"]
  outputs: ["gesture_model.onnx as ONE self-contained file", "The package list: gesture_model.onnx, gesture_config.json, gesture_labels.json, predict_gesture_onnx.py, gesture_preprocess.py, gesture_io.py"]
  negative_scope:
    - "Does not copy files to a board (needs approval) or install packages there"
    - "Does not import torch on the target"
    - "Does not claim the exported model is correct before validation (on-device-gesture-validation checks parity and accuracy)"
  validation:
    - "gesture_model.onnx exists and no gesture_model.onnx.data side file remains"
    - "The model loads and predicts in an environment with only numpy and onnxruntime"
  failure_behavior: "Report the first error line; map it to a known failure mode below or say it is unknown; do not edit the model or the export settings silently."
  known_failure_modes:
    - "Export crashes with ModuleNotFoundError onnxscript on current PyTorch: requirements did not list onnx/onnxscript (fixed in requirements-train-pytorch.txt; evidence/pc-run/05_export_onnx_FAILED_missing_onnxscript.log)"
    - "Export crashes with UnicodeEncodeError on a redirected Windows console (cp1252) because PyTorch prints a check mark (fixed: the export script switches stdout to UTF-8; evidence/pc-run/05_export_onnx_FAILED_cp1252_unicode.log)"
    - "New PyTorch writes weights to gesture_model.onnx.data; copying only the .onnx fails at load (fixed: the script embeds the weights; evidence/pc-run/08_copy_without_data_file.log)"
    - "predict_gesture_onnx.py imported gesture_pytorch_model.py, which imports torch, so the documented torch-free Ventuno Q path failed with ModuleNotFoundError (and could crash with an illegal instruction where torch is installed but incompatible). Fixed: NumPy-only code moved to gesture_preprocess.py (evidence/pc-run/10_predict_without_torch_BEFORE_FIX.log and _AFTER_FIX.log)"
  two_config_evidence:
    - "PC (Windows ARM64 host, x64 Python 3.10 under emulation, clean venv), 2026-11-05: export OK after four fixes, single file 163 KB, torch-free predict OK (evidence/pc-run/05_export_onnx.log, 10_predict_without_torch_AFTER_FIX.log)"
    - "Second configuration, Qualcomm IQ8 (aarch64, Qualcomm Linux 2.0, Python 3.14.4, onnxruntime 1.31.1 in a venv, no torch), 2026-11-10: the same model loads and predicts; logits match the PC on 150 samples within 2.4e-07 (evidence/iq8-run/cross-machine-parity.json)"
    - "Ventuno Q: not run (Ubuntu, aarch64; onnxruntime wheel availability unverified)"
authority:
  source_docs: "See synapse.authoritative_docs"
  approved_tools: ["gesture_scripts/export_gesture_pytorch_to_onnx.py", "gesture_scripts/predict_gesture_onnx.py"]
  endpoints: []
  provenance: "projects/gesture_recognition (gesture_scripts/); PC run evidence under evidence/pc-run/"
control:
  approval_gates: "See safety.requires_explicit_approval"
  consequential_actions: ["Writes gesture_model.onnx; removes the .onnx.data side file the export itself created"]
  recovery_and_rollback: "Delete gesture_model.onnx; the .pt checkpoint is untouched."
review_gates:
  # pilot = gates 1 + 3 met; supported = all six met
  ownership: "met: named owner; backup owner open (F20)"
  scope_and_boundary: "met: see negative_scope"
  validation_evidence: "partial: 1 of 2 configurations run (PC); Ventuno Q not run"
  feedback_mechanism: "open: community channel not yet defined"
  discoverability: "open: not yet on the Developer Portal"
  lifecycle_commitment: "open: community maintenance model undefined (F20)"
project:
  root_relative_to_skill: "../.."
safety:
  default_mode: "non-destructive"
  requires_explicit_approval:
    - "Copying files to a board"
    - "Installing packages on a board"
  secrets_policy: "Never persist credentials, tokens, private keys, or passwords. Read them from environment variables; redact before logging."
