<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QUAD Client — Python SDK for the QUAD MCP server">
  <title>QUAD Client</title>
  <defs>
    <linearGradient id="qcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3253DC"/>
      <stop offset="100%" stop-color="#14B8E6"/>
    </linearGradient>
    <linearGradient id="qcCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8E6"/>
      <stop offset="100%" stop-color="#3253DC"/>
    </linearGradient>
  </defs>

  <!-- ===== Chip / die mark (shared with QUAD) ===== -->
  <g transform="translate(20,20)">
    <g fill="url(#qcGrad)">
      <rect x="34" y="0"  width="10" height="14" rx="3"/>
      <rect x="55" y="0"  width="10" height="14" rx="3"/>
      <rect x="76" y="0"  width="10" height="14" rx="3"/>
      <rect x="34" y="106" width="10" height="14" rx="3"/>
      <rect x="55" y="106" width="10" height="14" rx="3"/>
      <rect x="76" y="106" width="10" height="14" rx="3"/>
      <rect x="0"  y="34"  width="14" height="10" rx="3"/>
      <rect x="0"  y="55"  width="14" height="10" rx="3"/>
      <rect x="0"  y="76"  width="14" height="10" rx="3"/>
      <rect x="106" y="34" width="14" height="10" rx="3"/>
      <rect x="106" y="55" width="14" height="10" rx="3"/>
      <rect x="106" y="76" width="14" height="10" rx="3"/>
    </g>

    <rect x="12" y="12" width="96" height="96" rx="20" fill="url(#qcGrad)"/>
    <rect x="22" y="22" width="76" height="76" rx="14" fill="#ffffff"/>

    <g fill="url(#qcGrad)">
      <rect x="33" y="33" width="24" height="24" rx="6"/>
      <rect x="63" y="33" width="24" height="24" rx="6"/>
      <rect x="33" y="63" width="24" height="24" rx="6"/>
    </g>
    <rect x="63" y="63" width="24" height="24" rx="6" fill="url(#qcCore)"/>
    <circle cx="75" cy="75" r="5.5" fill="#ffffff"/>
  </g>

  <!-- ===== Wordmark + CLIENT badge ===== -->
  <text x="170" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="2" fill="url(#qcGrad)">QUAD</text>

  <!-- CLIENT pill -->
  <rect x="173" y="90" width="92" height="24" rx="12" fill="url(#qcGrad)"/>
  <text x="219" y="107" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.5" fill="#ffffff">CLIENT</text>
  <text x="276" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0.5" fill="#475569">Python SDK for the QUAD MCP server</text>
</svg>
