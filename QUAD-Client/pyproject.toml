[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quad-mcp-client"
version = "0.2.0"
description = "Lightweight client provisioner for the QUAD (Qualcomm Unified Agent for Developers) MCP server. Configures Claude Code (or another MCP-compatible IDE) to talk to a local, SSH-tunnelled, or hosted QUAD MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "QUAD Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude-code",
    "qualcomm",
    "snapdragon",
    "ai",
    "npu",
    "quad",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

# Intentionally minimal: typer for the CLI, httpx for the SSE/HTTP probe.
# No fastmcp, no numpy, no pydantic, no quad-agent. The total footprint
# of the [client] install is <10 MB. This is the whole point.
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
]
# Extra deps for running the sample scripts under samples/.
# Installed automatically by install.sh alongside the core client package.
samples = [
    "fastmcp>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "onnxruntime>=1.18",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.urls]
Homepage    = "https://github.qualcomm.com/pavanr/QUAD-Client"
Server      = "https://github.qualcomm.com/pavanr/QUAD"
Issues      = "https://github.qualcomm.com/pavanr/QUAD-Client/issues"
Discussions = "https://github.qualcomm.com/pavanr/QUAD-Client/discussions"

[project.scripts]
quad-client = "quad_mcp_client.cli:cli"

# ─── Build configuration ─────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/quad_mcp_client"]
# The .md skills under src/quad_mcp_client/claude_code/skills_content are
# included automatically because they live inside the package tree.
# Hatch's wheel target picks them up as package data.

[tool.hatch.build.targets.sdist]
include = [
    "src/quad_mcp_client",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "install.sh",
    "install.ps1",
    "pyproject.toml",
]

# ─── Tooling ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by line-length

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
