schema_version: "1.0"
id: "quad-client-installation"
name: "QUAD-Client Installation"
version: "0.1.0"
description: "Prepare and validate QUAD-Client transport selection without installing MCP settings by default."
entrypoint: "SKILL.md"
kind: "journey-skill"
language: "en"
selection:
  aliases: ["set up QUAD Client", "install QUAD Client"]
  triggers: ["Prepare QUAD-Client", "Choose a QUAD MCP transport"]
synapse:
  layer: "journey"
  domain: "quad-client"
  owner: "P3 portfolio maintainers"
  review_cadence: "Each QUAD-Client release"
  visibility: "public"
  maturity: "pilot"
  developer_journey_stage: ["enablement"]
  dependencies: ["p3-project-onboarding", "p3-evidence-and-compatibility"]
  authoritative_docs: ["../../README.md", "../../docs/INSTALL.md", "../../src/quad_mcp_client/cli.py"]
contract:
  prerequisites: ["Python 3.10+", "QUAD-Client source checkout"]
  inputs: ["Selected transport", "Optional runtime-supplied transport settings"]
  outputs: ["Redacted configuration preview", "Connection-probe result", "Dated evidence record"]
  negative_scope: ["Does not write MCP client configuration by default", "Does not install optional dependencies without approval"]
  validation: ["quad-client preview renders the selected transport", "quad-client connect-test reports the transport result"]
safety:
  default_mode: "non-destructive"
  requires_explicit_approval: ["Installing packages", "Running quad-client install", "Overwriting configuration", "Using an SSH key or bearer token"]
  secrets_policy: "Accept secrets only at runtime and redact them from all output and evidence."
