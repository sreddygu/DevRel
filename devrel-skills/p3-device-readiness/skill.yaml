schema_version: "1.0"
id: "p3-device-readiness"
name: "P3 Device Readiness"
version: "1.0.0"
description: "Validate a public hardware target before device-affecting project workflows."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
synapse:
  layer: "domain"
  domain: "p3-portfolio"
  owner: "P3 portfolio maintainers"
  review_cadence: "Each device image, SDK, or runtime release"
  visibility: "public"
  maturity: "pilot"
  developer_journey_stage: ["enablement", "platform-experience"]
contract:
  inputs: ["Publicly obtainable device", "Project compatibility declaration", "Output path"]
  outputs: ["Dated readiness record", "Supported or unsupported target result"]
  negative_scope: ["Does not change device configuration by default", "Does not claim support without target evidence"]
safety:
  default_mode: "non-destructive"
  requires_explicit_approval: ["Installing device packages", "Copying models", "Capturing sensors", "Opening a camera", "Flashing firmware", "Changing network configuration"]
  secrets_policy: "Do not persist device credentials, private keys, or private endpoints."
