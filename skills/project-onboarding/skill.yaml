schema_version: "1.0"
id: "project-onboarding"
name: "P3 Project Onboarding"
version: "1.0.0"
description: "Classify a portfolio project and prepare its public P3 delivery path."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
synapse:
  layer: "domain"
  domain: "p3-portfolio"
  owner: "P3 portfolio maintainers"
  review_cadence: "Each project release or delivery-model change"
  visibility: "public"
  maturity: "pilot"
  developer_journey_stage: ["discovery", "enablement"]
  authoritative_docs: ["references/P3_DELIVERY_MODELS.md"]
contract:
  inputs: ["Project README", "Existing skill catalog if present"]
  outputs: ["Delivery-lane recommendation", "Next project-local skills", "Readiness gaps"]
  negative_scope: ["Does not claim unsupported device validation", "Does not create empty project-local skill stubs"]
safety:
  default_mode: "non-destructive"
  secrets_policy: "Do not collect or publish credentials, internal URLs, or private endpoints."
