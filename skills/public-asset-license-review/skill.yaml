schema_version: "1.0"
id: "public-asset-license-review"
name: "Public Asset License Review"
version: "1.0.0"
description: "Review public distribution eligibility for source, model, data, and binary assets."
entrypoint: "SKILL.md"
kind: "domain-skill"
language: "en"
synapse:
  layer: "domain"
  domain: "shared-skills"
  owner: "Project maintainers"
  review_cadence: "Before every release and when any asset changes"
  visibility: "public"
  maturity: "pilot"
  developer_journey_stage: ["discovery", "enablement"]
contract:
  inputs: ["Asset inventory", "Source and license information"]
  outputs: ["Redistribution decision", "Public retrieval instructions", "License notes"]
  negative_scope: ["Does not provide legal advice", "Does not redistribute restricted assets"]
safety:
  default_mode: "non-destructive"
  secrets_policy: "Never package credentials, private certificates, internal builds, or private URLs."
