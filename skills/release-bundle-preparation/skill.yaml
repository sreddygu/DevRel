schema_version: "1.0"
id: "release-bundle-preparation"
name: "Release Bundle Preparation"
version: "1.0.0"
description: "Prepare and validate a public release bundle."
entrypoint: "SKILL.md"
kind: "journey-skill"
language: "en"
synapse:
  layer: "journey"
  domain: "shared-skills"
  owner: "Project maintainers"
  review_cadence: "Each public release"
  visibility: "public"
  maturity: "pilot"
  developer_journey_stage: ["enablement", "platform-experience"]
  dependencies: ["evidence-and-compatibility", "public-asset-license-review"]
  authoritative_docs: ["references/DELIVERY_MODELS.md", "resources/release-bundle.schema.json"]
contract:
  inputs: ["Source revision", "Release assets", "Evidence", "Compatibility matrix"]
  outputs: ["Validated release-bundle.json", "Immutable public release checklist"]
  negative_scope: ["Does not publish private assets", "Does not approve unreviewed licenses"]
safety:
  default_mode: "non-destructive"
  secrets_policy: "Do not include credentials, tokens, internal URLs, or private endpoints in release assets or manifests."
